<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Presenter - Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- LIGHT GLASS THEME VARIABLES --- */
        :root {
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.08);
            --btn-bg: rgba(0, 0, 0, 0.03);
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #f1f5f9 0%, #f8fafc 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }

        /* --- LOGO ANIMATION --- */
        @keyframes korPulse { 
            0%{transform:scale(1);box-shadow:0 0 0 rgba(124, 58, 237, 0)} 
            50%{transform:scale(1.05);box-shadow:0 0 20px rgba(124, 58, 237, 0.15)} 
            100%{transform:scale(1);box-shadow:0 0 0 rgba(124, 58, 237, 0)} 
        } 
        .korLogo { 
            width: 70px; height: 70px; border-radius: 18px; 
            background: white; 
            display: grid; place-items: center; margin-bottom: 24px;
            animation: korPulse 3s ease-in-out infinite;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .korLogo img { width: 40px; height: 40px; border-radius: 6px; display: block; }

        /* --- MAIN CARD --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 32px 24px;
            width: 90%; max-width: 380px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.5px; }
        p { color: var(--text-sub); font-size: 0.85rem; margin-bottom: 24px; }

        /* --- BUTTON GRID --- */
        .menu-grid { display: flex; flex-direction: column; gap: 12px; }

        .btn-main {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; padding: 12px 16px;
            background: var(--btn-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            color: var(--text-main); 
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer; transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-main:hover {
            background: white;
            border-color: var(--accent);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.08);
        }

        .btn-content { display: flex; align-items: center; gap: 12px; }
        .icon-box { 
            width: 34px; height: 34px; 
            background: white; 
            border-radius: 8px; 
            display: grid; place-items: center;
            color: var(--accent);
            border: 1px solid var(--glass-border);
        }

        /* --- SUB-OPTIONS --- */
        .options-container {
            max-height: 0; overflow: hidden; opacity: 0;
            transition: all 0.3s ease-out;
            display: flex; flex-direction: column; gap: 8px;
        }
        
        .options-container.open {
            max-height: 200px; opacity: 1; margin-top: 4px; padding-bottom: 8px;
        }

        .btn-sub {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; margin-left: 12px;
            background: rgba(0,0,0,0.02);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-sub); 
            font-size: 0.8rem;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn-sub:hover { background: white; color: var(--accent); border-color: var(--accent); }

    </style>
</head>
<body>

    <div class="korLogo">
        <img src="https://lh3.googleusercontent.com/d/1iLMCP2wh8e4BdxM_rds3W1GxkX0LVUqi=s220" alt="Logo" />
    </div>

    <div class="glass-panel">
        <h1>Global Presenter</h1>
        <p>Select your role to begin</p>

        <div class="menu-grid">
            
            <!-- AUDIENCE -->
            <a href="./audience.html" class="btn-main" target="_blank">
                <div class="btn-content">
                    <div class="icon-box">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
                    </div>
                    <span>Audience View</span>
                </div>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" opacity="0.3" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </a>

            <!-- CONTROLLER -->
            <a href="./controller.html" class="btn-main" target="_blank">
                <div class="btn-content">
                    <div class="icon-box">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12" y2="18"></line></svg>
                    </div>
                    <span>Controller</span>
                </div>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" opacity="0.3" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </a>

            <!-- Worship PRESENTER -->
            <div onclick="toggleSection('song-opts', 'song-chev')" class="btn-main">
                <div class="btn-content">
                    <div class="icon-box">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                    </div>
                    <span>Worship Presenter</span>
                </div>
                <svg id="song-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" opacity="0.3" stroke-width="2" style="transition:0.3s"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>

            <div id="song-opts" class="options-container">
                <a href="./Worship/worship-desktop" class="btn-sub" target="_blank">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                    Desktop Console
                </a>

            </div>

            <!-- Exhort PRESENTER -->
            <div onclick="toggleSection('gen-opts', 'gen-chev')" class="btn-main">
                <div class="btn-content">
                    <div class="icon-box">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                    <span>Exhort Presenter</span>
                </div>
                <svg id="gen-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" opacity="0.3" stroke-width="2" style="transition:0.3s"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>

            <div id="gen-opts" class="options-container">
                <a href="./present_desktop.html" class="btn-sub" target="_blank">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                    Desktop Console
                </a>
                <a href="./present_mobile.html" class="btn-sub" target="_blank">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12" y2="18"></line></svg>
                    Mobile Remote
                </a>
            </div>

        </div> <!-- end menu-grid -->
    </div> <!-- end glass-panel -->

    <script>
        function toggleSection(containerId, chevronId) {
            const options = document.getElementById(containerId);
            const chevron = document.getElementById(chevronId);
            
            if (options.classList.contains('open')) {
                options.classList.remove('open');
                chevron.style.transform = 'rotate(0deg)';
            } else {
                options.classList.add('open');
                chevron.style.transform = 'rotate(180deg)';
            }
        }
    </script>

</body>
</html>
