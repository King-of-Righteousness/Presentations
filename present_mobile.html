 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Presenter - Mobile Touch</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- MOBILE VARIABLES & RESET --- */
        * { box-sizing: border-box; outline: none; user-select: none; }
        
        /* DEFAULT LIGHT MODE */
        :root { 
            --bg-color: #f8fafc; 
            --text-color: #334155; 
            --sidebar-bg: rgba(255, 255, 255, 0.85); 
            --main-bg: radial-gradient(circle at center, #e2e8f0 0%, #cbd5e1 100%); 
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(0, 0, 0, 0.1); 
            --glass-highlight: rgba(0, 0, 0, 0.05); 
            --accent: #8b5cf6; 
            --accent-hover: #7c3aed; 
            --danger: #ef4444; 
            --success: #10b981; 
            --muted: #64748b;
            --radius: 8px; 
            --preview-bg: #e2e8f0; 
        }

        /* DARK MODE OVERRIDE */
        body.dark-mode { 
            --bg-color: #020617;
            --text-color: #e2e8f0; 
            --sidebar-bg: rgba(2, 6, 23, 0.8); 
            --main-bg: radial-gradient(circle at center, #1e293b 0%, #020617 100%); 
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08); 
            --glass-highlight: rgba(255, 255, 255, 0.05); 
            --muted: #94a3b8; 
            --preview-bg: #000;
        }

        html { height: 100%; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; height: 100vh; height: 100dvh; display: flex; overflow: hidden; transition: background-color 0.3s, color 0.3s; }
        
        /* UI Components */
        button { cursor: pointer; border: none; font-family: 'Inter', sans-serif; transition: all 0.2s; }
        button:active { transform: scale(0.96); }
        .btn { padding: 6px 12px; border-radius: var(--radius); font-size: 0.8rem; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--glass-highlight); border: 1px solid var(--glass-border); color: var(--text-color); }
        .btn:hover { background: rgba(125,125,125,0.1); border-color: var(--accent); }
        .btn.primary { background: var(--accent); color: white; border: none; }
        .btn.primary:hover { background: var(--accent-hover); }
        .btn.danger { color: var(--danger); border-color: rgba(239,68,68,0.3); }
        .btn.danger:hover { background: rgba(239,68,68,0.1); }
        .btn.success { color: var(--success); border-color: rgba(16,185,129,0.3); }
        .btn.success:hover { background: rgba(16,185,129,0.1); border-color: var(--success); }

/* --- FIXED MOBILE LAYOUT --- */
#main-area { 
    flex-grow: 1; 
    display: flex; 
    flex-direction: column; 
    position: relative; 
    background: var(--main-bg); 
    min-width: 0; /* Ensures it shrinks properly between the panes */
}
        
#sidebar { 
    width: 260px; 
    flex-shrink: 0; 
    height: 100%; 
    overflow-y: auto; 
    padding-bottom: 80px; 
    background: var(--sidebar-bg); 
    border-right: 1px solid var(--glass-border); 
    backdrop-filter: blur(10px); 
    /* Removed: position: absolute, transforms, and transitions */
}
        
#right-pane { 
    width: 280px; 
    flex-shrink: 0; 
    height: 100%; 
    overflow-y: auto; 
    padding-bottom: 80px; 
    background: var(--sidebar-bg); 
    border-left: 1px solid var(--glass-border); 
    backdrop-filter: blur(10px); 
    /* Removed: position: absolute, transforms, and transitions */
}

/* Hide the slide-out overlay and toggle buttons permanently */
.menu-overlay, 
.menu-overlay.active, 
.mobile-toggles, 
.mobile-toggle-btn,
#sidebar.open,
#right-pane.open { 
    display: none !important; 
}

        #mobile-timer { display: none !important; position: absolute; top: 10px; right: 10px; z-index: 150; font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: bold; background: rgba(15, 23, 42, 0.85); color: #ffffff !important; padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.3s, opacity 0.3s; }

        #restore-tools-btn { display: none !important; position: fixed; bottom: 20px; right: 20px; z-index: 101; width: 50px; height: 50px; border-radius: 50%; background: var(--accent); border: 2px solid white; color: white; font-size: 1.4rem; box-shadow: 0 4px 15px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transform: scale(0.8); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        body.hide-ui #restore-tools-btn { opacity: 1; pointer-events: auto; transform: scale(1); }

        #notification-box { display: none; position: absolute; top: 60px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; background: rgba(239, 68, 68, 0.95); border: 1px solid #f87171; border-radius: 8px; padding: 12px 16px; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: slideDown 0.3s ease-out; z-index: 200; flex-direction: row; align-items: center; justify-content: space-between; gap: 15px; backdrop-filter: blur(10px); }
        @keyframes slideDown { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        #notif-text { font-weight: 600; font-size: 0.9rem; flex: 1; }

        #preview-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; overflow: hidden; position: relative; gap: 0; }
        #preview-container { position: relative; background: var(--preview-bg); box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: none; border-radius: 0; touch-action: none; transform-origin: 0 0; }
        
        #preview, #drawCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #preview { z-index: 1; object-fit: contain; }
        #drawCanvas { z-index: 2; pointer-events: auto; }
        #preview-loader { position: absolute; top:0; left:0; width:100%; height:100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--bg-color); z-index: 5; color: var(--muted); pointer-events: none; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--glass-border); border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #textInput { position: absolute; display: none; z-index: 1000; background: transparent; color: inherit; border: 1px dashed var(--accent); padding: 0 4px; font-family: 'Inter', sans-serif; font-weight: bold; min-width: 50px; height: 30px; line-height: 30px; outline: none; pointer-events: auto; }

      //  .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border); background: rgba(2, 6, 23, 0.9); height: auto; padding: 10px; flex-direction: column; gap: 10px; z-index: 100; display: flex; transition: transform 0.3s, opacity 0.3s; }
        
        .bottom-nav { 
    position: fixed; 
    bottom: 0; 
    left: 0; 
    width: 100%; 
    backdrop-filter: blur(20px); 
    border-top: 1px solid var(--glass-border); 
    background: var(--sidebar-bg); /* Matches the Left/Right panes */
    color: var(--text-color);      /* Ensures text is visible */
    height: auto; 
    padding: 10px; 
    flex-direction: column; 
    gap: 10px; 
    z-index: 100; 
    display: flex; 
}

        #mobile-tools-group { display: flex; order: 2; flex-wrap: wrap; justify-content: center; gap: 8px; }
        #mobile-colors-group { display: flex; order: 3; flex-wrap: wrap; justify-content: center; gap: 8px; }
        #mobile-size-group { display: none; order: 4; flex-direction: row; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 0 10px; }
        .nav-controls { display: flex; order: 1; gap: 20px; align-items: center; width: 100%; justify-content: center; }
        .slide-counter { font-size: 0.9rem; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
        
        .mobile-tool-btn { width: 36px; height: 36px; padding: 0; font-size: 1.1rem; border-radius: 6px; }
        .mobile-tool-btn.active { background: var(--accent); border-color: var(--accent); color: white; box-shadow: 0 0 10px rgba(139, 92, 246, 0.4); }
        .btn-icon-only { padding: 6px; width: 32px; height: 32px; }

        .color-dot { width: 24px; height: 24px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .color-dot.active { border-color: white; transform: scale(1.1); box-shadow: 0 0 8px rgba(125,125,125,0.5); }
        
        input[type=range] { flex: 1; height: 4px; border-radius: 2px; background: var(--glass-border); outline: none; -webkit-appearance: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.5); }

        .sidebar-header { padding: 12px; border-bottom: 1px solid var(--glass-border); display: flex; flex-direction: column; gap: 8px; }
        #thumb-list { overflow-y: auto; flex-grow: 1; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .slide-thumb { width: 100%; cursor: pointer; border: 2px solid transparent; opacity: 0.5; transition: 0.2s; border-radius: 4px; background: #000; min-height: 50px; object-fit: cover; }
        .slide-thumb.active { border-color: var(--accent); opacity: 1; box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); }
        
        .timer-box { text-align: center; background: var(--glass-highlight); padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); margin-bottom: 20px; }
        #timer { font-size: 2rem; font-weight: 700; color: var(--text-color); font-family: 'JetBrains Mono', monospace; line-height: 1; margin: 8px 0 12px; }
        .tool-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .group-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; margin-bottom: 2px; }
        
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #020617; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .login-box { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 40px; border-radius: 24px; border: 1px solid var(--glass-border); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.7); }
        .korLogo { width: 80px; height: 80px; border-radius: 20px; background: #1e293b; display: grid; place-items: center; margin: 0 auto 25px; border: 1px solid rgba(255,255,255,0.1); }
        .korLogo img { width: 50px; height: 50px; border-radius: 8px; display: block; }
        .login-input { width: 100%; border: 1px solid var(--glass-border); border-radius: 12px; padding: 16px; background: rgba(0,0,0,0.3); color: white; outline: none; font-family: inherit; font-size: 16px; text-align: center; margin-bottom: 10px; transition: 0.2s; }
        .login-input:focus { border-color: var(--accent); background: rgba(0,0,0,0.6); }
        #loginBtn { width: 100%; padding: 14px; font-size: 1rem; border-radius: 12px; margin-top: 10px; }

     //   body.hide-ui .bottom-nav { opacity: 0; transform: translateY(100%); pointer-events: none; }
        body.hide-ui .mobile-toggles { opacity: 0; transform: translateY(-100%); pointer-events: none; }
        body.hide-ui #mobile-timer { opacity: 0; transform: translateY(-100%); }

        @media (orientation: landscape) {
             .bottom-nav { flex-direction: row; justify-content: space-between; padding: 5px 15px; flex-wrap: wrap; }
             .nav-controls { width: auto; order: 2; flex: 1; }
             #mobile-tools-group { order: 1; margin-right: auto; }
             #mobile-colors-group { order: 3; margin-left: auto; }
             #mobile-size-group { order: 5; flex-basis: 100%; margin-top: 5px; }
             .mobile-tool-btn { width: 44px; height: 34px; }
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <div class="korLogo"><img src="https://lh3.googleusercontent.com/d/1iLMCP2wh8e4BdxM_rds3W1GxkX0LVUqi=s220" alt="K" /></div>
            <h2 style="margin: 0 0 8px 0; font-size: 20px; color:white; font-weight: 600;">Presenter Mobile</h2>
            <p style="color:var(--muted); font-size:14px; margin: 0 0 30px 0;">Authorized Personnel Only</p>
            
            <input type="email" id="loginEmail" class="login-input" placeholder="Email Address">
            <input type="password" id="loginPass" class="login-input" placeholder="Password">
            
            <button id="loginBtn" class="btn primary">Login</button>
            
            <div style="text-align:center; margin-top:15px;">
                <button onclick="window.resetUserPassword()" style="background:none; border:none; color:var(--muted); font-size:12px; text-decoration:underline; cursor:pointer;">Forgot Password?</button>
            </div>

            <p id="loginMsg" style="color:var(--danger); font-size:13px; margin-top:20px; min-height:1em;"></p>
        </div>
    </div>

    <div id="app-container" style="display:flex; width:100%; height:100%; opacity:0; pointer-events:none; transition: opacity 0.5s;">
        <div class="menu-overlay" onclick="closeMenus()"></div>
        
        <div id="mobile-timer">00:00</div>
        
        <div class="mobile-toggles">
            <button class="mobile-toggle-btn" onclick="toggleRightPane()">🛠️</button>
            <button class="mobile-toggle-btn" onclick="toggleSidebar()">🗂️</button>
        </div>

        <div id="sidebar">
            <div class="sidebar-header">
                <button class="btn" onclick="toggleTheme()">🌗 Dark/Light</button>
                <div style="display:flex; gap:6px;">
                    <button class="btn" style="flex:1;" onclick="toggleFullScreen()">⛶ Screen</button>
                    <button class="btn success" style="flex:1;" onclick="startSync(true)">🔄 Sync</button>
                </div>
                <div id="scan-wrapper" style="display:none; margin-top:8px;">
                     <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-bottom:4px;"><span id="scan-msg">Loading...</span></div>
                     <div style="width:100%; background:var(--glass-highlight); height:6px; border-radius:3px; overflow:hidden;"><div id="scan-bar" style="width:0%; background:var(--success); height:100%;"></div></div>
                </div>
            </div>
            <div id="thumb-list"></div>
        </div>

        <div id="main-area">
            <div id="preview-wrapper">
                <div id="notification-box" style="display:none;">
                    <div style="display:flex; align-items:center; gap:10px;"><span style="font-size:1.2rem;">📢</span><span id="notif-text">Controller Message</span></div>
                    <button class="btn" style="background:white; color:#dc2626; border:none; padding:8px 16px;" onclick="acknowledgeMessage()">Acknowledge</button>
                </div>
                <div id="preview-container">
                    <div id="preview-loader"><div class="spinner"></div><div id="loader-text" style="font-size:12px; font-weight:600;">Connecting...</div></div>
                    <img id="preview" src="" style="display:none;" crossorigin="anonymous">
                    <canvas id="drawCanvas"></canvas>
                    <input type="text" id="textInput" placeholder="Type..." autocomplete="off">
                </div>
            </div>
            <button id="restore-tools-btn" onclick="showControls()">✏️</button>

            <div class="bottom-nav">
                <div id="mobile-tools-group">
                    <button id="btnStopMob" class="btn mobile-tool-btn danger" style="border-color: rgba(239,68,68,0.5);" onclick="setTool('stop')">🚫</button>
                    <button id="btnPenMob" class="btn mobile-tool-btn active" onclick="setTool('pen')">🖊️</button>
                    <button id="btnHighlighterMob" class="btn mobile-tool-btn" onclick="setTool('highlighter')">🖍️</button>
                    <button id="btnTextMob" class="btn mobile-tool-btn" onclick="setTool('text')">🔤</button>
                    <button id="btnEraserMob" class="btn mobile-tool-btn" onclick="setTool('eraser')">🧽</button>
                    <button id="btnHandMob" class="btn mobile-tool-btn" onclick="setTool('hand')">✋</button>
                    <button id="btnResetZoom" class="btn mobile-tool-btn" onclick="resetZoom()">🔄</button>
                </div>

                <div class="nav-controls">
                    <button class="btn" onclick="changeSlide(-1)">◀️Previous</button>
                    <span class="slide-counter">Slide <span id="slide-num">0</span> / <span id="total-num">0</span></span>
                    <button class="btn" onclick="changeSlide(1)">Next▶️</button>
                </div>
                
                <div id="mobile-colors-group">
                    <div class="color-dot active" style="background:#ef4444;" onclick="setColor('red', this)"></div>
                    <div class="color-dot" style="background:#facc15;" onclick="setColor('#facc15', this)"></div> 
                    <div class="color-dot" style="background:#22c55e;" onclick="setColor('#22c55e', this)"></div> 
                    <div class="color-dot" style="background:#3b82f6;" onclick="setColor('#3b82f6', this)"></div> 
                    <div class="color-dot" style="background:#000000; border:1px solid #666;" onclick="setColor('#000000', this)"></div>
                </div>

                <div id="mobile-size-group">
                    <span style="font-size:10px; color:var(--muted);">Size</span>
                    <input type="range" id="toolSize" min="5" max="80" value="10" oninput="setSize(this.value)">
                </div>
            </div>
        </div>

        <div id="right-pane">
            <div class="timer-box">
                <div id="preshow-overlay">Starting in: <span id="preshow-count">60</span>s</div>
                <div id="timer">00:00</div>
                <div style="display:flex; gap:6px; justify-content:center;">
                    <button class="btn-icon-only btn" style="color:#10b981; border-color:rgba(16,185,129,0.3)" onclick="startTimer()">▶</button>
                    <button class="btn-icon-only btn" style="color:#f59e0b; border-color:rgba(245,158,11,0.3)" onclick="pauseTimer()">⏸</button>
                    <button class="btn-icon-only btn" style="color:#ef4444; border-color:rgba(239,68,68,0.3)" onclick="resetTimer()">⏹</button>
                </div>
            </div>
            <hr style="border:0; border-top:1px solid var(--glass-border); width:100%; margin:0;">
            <div class="tool-group">
                <div class="group-label">Tools</div>
                <button class="btn danger" style="margin-top:20px; border:1px solid rgba(239,68,68,0.3); background:transparent;" onclick="logout()">🔒 Log Off</button>
                <button class="btn" style="flex:1; margin-top:10px;" onclick="undoLast()">↩ Undo</button>
                <button class="btn danger" style="flex:1;" onclick="clearCanvas(true)">🗑️ Clear</button>
                <button id="btnBlackout" class="btn" style="background:#0f172a; margin-top:10px;" onclick="toggleBlackout()">🔴 SCREEN IS OFF</button>
            </div>
        </div>
    </div>

    <script type="module">
        // ✅ 1. UPDATED IMPORTS TO v10.7.1
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getDatabase, ref, set, push, onValue, remove, get, query, limitToLast, onDisconnect, serverTimestamp as rtdbTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // --- GLOBAL UI FUNCTIONS ---
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            const isOpen = document.getElementById('sidebar').classList.contains('open');
            document.querySelector('.menu-overlay').classList.toggle('active', isOpen);
            document.getElementById('right-pane').classList.remove('open');
        }

        function toggleRightPane() {
            document.getElementById('right-pane').classList.toggle('open');
            const isOpen = document.getElementById('right-pane').classList.contains('open');
            document.querySelector('.menu-overlay').classList.toggle('active', isOpen);
            document.getElementById('sidebar').classList.remove('open');
        }

        function closeMenus() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('right-pane').classList.remove('open');
            document.querySelector('.menu-overlay').classList.remove('active');
        }

        // --- EXPOSE UI FUNCTIONS ---
        window.toggleSidebar = toggleSidebar;
        window.toggleRightPane = toggleRightPane;
        window.closeMenus = closeMenus;
        
        // --- SHOW CONTROLS LOGIC ---
        let hideTimer;
        function showControls() {
            clearTimeout(hideTimer);
            document.body.classList.remove('hide-ui');
            startHideTimer();
        }
        window.showControls = showControls;
        function startHideTimer() {
            clearTimeout(hideTimer);
            if (window.innerWidth > window.innerHeight) {
                 hideTimer = setTimeout(() => {
                     document.body.classList.add('hide-ui');
                 }, 3000);
            }
        }

        const firebaseConfig = {
            apiKey: "AIzaSyCWAxUm_Z_i-EP_xqayhQrwsL4Qkmh5fMA",
            authDomain: "slidesync-37cd4.firebaseapp.com",
            databaseURL: "https://slidesync-37cd4-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "slidesync-37cd4",
            storageBucket: "slidesync-37cd4.firebasestorage.app",
            messagingSenderId: "996754972458",
            appId: "1:996754972458:web:7f8be6880c3463ac6a4853",
            measurementId: "G-GCBS3X7STT"
        };
        // ✅ 2. INIT FIREBASE SERVICES
        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const firestore = getFirestore(firebaseApp);
        const db = getDatabase(firebaseApp);

        // ==========================================
        // 3. RESET PASSWORD LOGIC
        // ==========================================
        window.resetUserPassword = async () => {
            const email = prompt("Enter your email address to reset password:");
            if (!email) return;

            try {
                await sendPasswordResetEmail(auth, email);
                alert(`✅ Password reset email sent to: ${email}\n\n⚠️ IMPORTANT: Please check your SPAM/JUNK folder if you do not see it in your inbox.`);
            } catch (error) {
                alert("Error: " + error.message);
            }
        };

        // ==========================================
        // 4. LOGIN TRACKER (Auto-Update Last Seen)
        // ==========================================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                updateDoc(doc(firestore, "users", user.uid), {
                    lastLogin: serverTimestamp()
                }).then(() => {
                    console.log("Login timestamp updated successfully.");
                }).catch((error) => {
                    console.error("Failed to update timestamp:", error);
                });
            }
        });

        // --- AUTH & ROLE LOGIC ---
        document.getElementById('loginBtn').addEventListener('click', () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;

                input.style.top = (elemStartY + dy) + 'px';
            };
            input.ontouchend = () => { isDraggingText = false; input.focus(); };

            input.onkeydown = null;
            input.onkeydown = (keyEvent) => {
                if (keyEvent.key === 'Enter') {
                    if (input.value.trim() !== "") {
                        const finalLeft = parseInt(input.style.left);
                        const finalTop = parseInt(input.style.top);
                        const xNorm = finalLeft / canvas.offsetWidth;
                        const yNorm = (finalTop + (inputHeight / 2)) / canvas.offsetHeight;
                        push(ref(db, 'presentation/drawing'), { type: 'text', text: input.value, x: xNorm, y: yNorm, color: currentColor, slide: currentSlide, size: currentSize });
                    }
                    input.style.display = 'none';
                }
                if (keyEvent.key === 'Escape') { input.style.display = 'none'; input.value = ''; }
            };
        }

        onValue(ref(db, 'presentation/drawing'), (snapshot) => {
            allDrawingData = []; 
            if(snapshot.exists()) { snapshot.forEach((childSnap) => { allDrawingData.push({ ...childSnap.val(), ref: childSnap.ref }); }); }
            redrawCanvas(); 
        });
        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            allDrawingData.forEach(data => {
                if (data.slide !== currentSlide) return;
                const size = data.size || (data.tool === 'highlighter' ? 40 : (data.tool === 'eraser' ? 50 : 10));
                if (data.type === 'path') {
                    ctx.save(); ctx.beginPath(); ctx.lineWidth = size;
                    if (data.tool === 'highlighter') { ctx.globalAlpha = 0.5; ctx.strokeStyle = data.color || 'yellow'; ctx.globalCompositeOperation = 'source-over'; }
                    else if (data.tool === 'eraser') { ctx.globalAlpha = 1.0; ctx.strokeStyle = 'rgba(0,0,0,1)'; ctx.globalCompositeOperation = 'destination-out'; } 
                    else { ctx.globalAlpha = 1.0; ctx.strokeStyle = data.color || 'red'; ctx.globalCompositeOperation = 'source-over'; }
                    ctx.lineCap = 'round';
                    const points = data.points ? Object.values(data.points) : [];
                    if(points.length > 0) {
                        ctx.moveTo(points[0].x * RENDER_W, points[0].y * RENDER_H);
                        for (let i = 1; i < points.length; i++) { ctx.lineTo(points[i].x * RENDER_W, points[i].y * RENDER_H); }
                    }
                    ctx.stroke();
                    ctx.restore();
                } else if (data.type === 'text') {
                    ctx.save();
                    const fontSize = data.size || 40; ctx.fillStyle = data.color || 'red'; ctx.font = `bold ${fontSize}px Inter, sans-serif`; 
                    ctx.textBaseline = 'top';
                    ctx.fillText(data.text, data.x * RENDER_W, data.y * RENDER_H);
                    ctx.restore();
                }
            });
        }

        window.undoLast = () => { for (let i = allDrawingData.length - 1; i >= 0; i--) { if (allDrawingData[i].slide === currentSlide) { remove(allDrawingData[i].ref); return; } } }
        window.clearCanvas = (sync) => { if(sync) { allDrawingData.forEach(d => { if (d.slide === currentSlide) remove(d.ref); }); } }

        window.toggleTheme = () => { document.body.classList.toggle('dark-mode'); }
        window.toggleFullScreen = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        function saveSession() {
            localStorage.setItem(SESSION_KEY, JSON.stringify({ timestamp: Date.now(), version: sessionVersion }));
        }
        setInterval(saveSession, 60 * 1000);
        function startNewSession(isRestore = false) {
            console.log("🚀 Starting Session. Restore Mode:", isRestore);
            if (!isRestore) {
                remove(ref(db, 'presentation/drawing'));
                set(ref(db, 'presentation/currentSlide'), 1);
                currentSlide = 1;
                updateStatus('online');
            } else {
                get(ref(db, 'presentation/currentSlide')).then(snap => {
                    if(snap.exists()) {
                        currentSlide = snap.val();
                        updateView();
                    }
                });
            }
            // --- CALL SYNC ON LOAD (FAST MODE) ---
            startSync(false);
            onValue(ref(db, 'presentation/message'), (snapshot) => {
                const box = document.getElementById('notification-box');
                const txt = document.getElementById('notif-text');
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    txt.innerText = data.text;
                    box.style.display = 'flex';
                } else { box.style.display = 'none'; }
            });
            onValue(ref(db, 'presentation/status'), (snapshot) => {
                const data = snapshot.val();
                const btn = document.getElementById('btnBlackout');
                if (data && data.state === 'offline') {
                    if(!isBlackout) {
                        btn.innerHTML = "🔴 SCREEN IS OFF";
                        btn.style.background = "var(--success)";
                        btn.style.color = "white";
                        isBlackout = true;
                    }
                } else {
                    if(isBlackout) {
                        btn.innerHTML = "🟢 SCREEN IS LIVE";
                        btn.style.background = "#0f172a";
                        btn.style.color = "#cbd5e1";
                        isBlackout = false;
                    }
                }
            });
        }

        document.addEventListener('keydown', (e) => {
            if(document.getElementById('textInput').style.display === 'block') return; 
            if (e.key === "ArrowLeft") changeSlide(-1);
            if (e.key === "ArrowRight" || e.key === " ") changeSlide(1);
        });
        window.onbeforeunload = function (e) {
            e.preventDefault();
            return undefined; 
        };
    </script>
</body>
</html>
