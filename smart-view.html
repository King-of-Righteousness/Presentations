<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic WebRTC Receiver</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; margin: 0; padding: 20px; }
        
        /* Video Container */
        .video-box { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/9; background: #000; border: 2px solid #334155; border-radius: 12px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); margin-bottom: 20px; }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        /* Controls */
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        button { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-reset { background: #ef4444; color: white; }
        .btn-reset:hover { background: #dc2626; }
        .btn-reload { background: #3b82f6; color: white; }
        .btn-reload:hover { background: #2563eb; }

        /* Logs */
        .log-panel { width: 100%; max-width: 800px; background: #1e293b; border-radius: 8px; padding: 15px; height: 200px; overflow-y: auto; font-size: 12px; border: 1px solid #334155; }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #334155; padding-bottom: 2px; }
        .log-time { color: #94a3b8; margin-right: 8px; }
        .log-info { color: #60a5fa; }
        .log-success { color: #4ade80; }
        .log-error { color: #f87171; font-weight: bold; }
        .log-warn { color: #facc15; }

        .status-badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 4px; font-size: 12px; border: 1px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div class="video-box">
        <video id="remoteVideo" autoplay playsinline controls muted></video>
        <div id="connectionStatus" class="status-badge">Disconnected</div>
    </div>

    <div class="controls">
        <button class="btn-reset" onclick="window.resetSignaling()">1. RESET SIGNALING (Clear DB)</button>
        <button class="btn-reload" onclick="window.location.reload()">2. REFRESH PAGE</button>
    </div>

    <div id="logPanel" class="log-panel"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCWAxUm_Z_i-EP_xqayhQrwsL4Qkmh5fMA", 
            authDomain: "slidesync-37cd4.firebaseapp.com", 
            databaseURL: "https://slidesync-37cd4-default-rtdb.europe-west1.firebasedatabase.app", 
            projectId: "slidesync-37cd4", 
            storageBucket: "slidesync-37cd4.firebasestorage.app", 
            messagingSenderId: "996754972458", 
            appId: "1:996754972458:web:7f8be6880c3463ac6a4853" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let pc = null;
        let candidateQueue = [];

        // --- LOGGER ---
        function log(msg, type = "info") {
            const panel = document.getElementById('logPanel');
            const div = document.createElement('div');
            div.className = `log-entry`;
            const time = new Date().toLocaleTimeString();
            div.innerHTML = `<span class="log-time">[${time}]</span><span class="log-${type}">${msg}</span>`;
            panel.prepend(div);
        }

        // --- 1. RESET FUNCTION ---
        window.resetSignaling = async () => {
            if(confirm("This will delete all WebRTC signals from Firebase. You MUST refresh the Presenter page after this.")) {
                log("Clearing Firebase Signaling Data...", "warn");
                await remove(ref(db, 'presentation/webrtc'));
                log("✅ Database Cleared. Now Refresh the Presenter!", "success");
            }
        };

        // --- 2. INIT WEBRTC ---
        async function start() {
            log("Initializing PeerConnection...", "info");
            
            const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
            pc = new RTCPeerConnection(config);

            pc.ontrack = (event) => {
                log("🎥 STREAM TRACK RECEIVED!", "success");
                document.getElementById('remoteVideo').srcObject = event.streams[0];
                document.getElementById('connectionStatus').innerText = "CONNECTED";
                document.getElementById('connectionStatus').style.color = "#4ade80";
            };

            pc.oniceconnectionstatechange = () => {
                const state = pc.iceConnectionState;
                log(`ICE State Change: ${state}`, state === 'connected' ? 'success' : 'warn');
                document.getElementById('connectionStatus').innerText = state.toUpperCase();
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    push(ref(db, 'presentation/webrtc/audience_candidates'), event.candidate.toJSON());
                }
            };

            listenForOffer();
            listenForCandidates();
        }

        // --- 3. SIGNALING LISTENERS ---
        function listenForOffer() {
            const offerRef = ref(db, 'presentation/webrtc/offer');
            onValue(offerRef, async (snapshot) => {
                const offer = snapshot.val();
                
                if (!offer) {
                    log("Waiting for Offer from Presenter...", "warn");
                    return;
                }

                // If we already have a remote description, ignore updates to avoid conflicts
                if (pc.signalingState !== "stable") {
                    log(`Ignored Offer (Signaling State: ${pc.signalingState})`, "warn");
                    return;
                }

                log("📩 Offer Received! Processing...", "info");

                try {
                    await pc.setRemoteDescription(new RTCSessionDescription(offer));
                    log("✅ Remote Description Set", "success");

                    // Process Queue
                    while (candidateQueue.length > 0) {
                        await pc.addIceCandidate(candidateQueue.shift());
                    }
                    if(candidateQueue.length > 0) log(`Processed ${candidateQueue.length} queued candidates`, "info");

                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    log("✅ Local Answer Created", "success");

                    await set(ref(db, 'presentation/webrtc/answer'), {
                        type: answer.type,
                        sdp: answer.sdp
                    });
                    log("📤 Answer sent to Firebase", "success");

                } catch (e) {
                    log(`CRITICAL ERROR: ${e.message}`, "error");
                    console.error(e);
                }
            });
        }

        function listenForCandidates() {
            const candidatesRef = ref(db, 'presentation/webrtc/presenter_candidates');
            onValue(candidatesRef, (snapshot) => {
                snapshot.forEach((child) => {
                    const candidate = new RTCIceCandidate(child.val());
                    if (pc.remoteDescription) {
                        pc.addIceCandidate(candidate).catch(e => log(`Candidate Error: ${e.message}`, "error"));
                    } else {
                        candidateQueue.push(candidate);
                    }
                });
            });
        }

        // Start automatically
        start();

    </script>
</body>
</html>
