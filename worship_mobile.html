 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Version Redirect</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 1rem;
        }
        h2 {
            margin-bottom: 1rem;
            color: #1e293b;
        }
        p {
            line-height: 1.6;
            color: #64748b;
        }
        .timer {
            font-weight: bold;
            color: #2563eb;
            font-size: 1.2rem;
        }
        .btn {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 10px 20px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">💻</div>
        <h2>Desktop Version Required</h2>
        <p>The <strong>Mobile Version</strong> is not available.<br>
        Please use the <strong>Desktop Version</strong>.</p>
        
        <p>Redirecting you now to the Desktop Version in:<br>
        <span class="timer" id="countdown">10</span> seconds</p>

        <a href="https://king-righteousness.w3spaces.com/WebDashProj/worship-desktop.html" class="btn">Go to Desktop Now</a>
    </div>

    <script>
        let timeLeft = 10;
        const targetURL = "https://king-righteousness.w3spaces.com/WebDashProj/worship-desktop.html";
        const display = document.getElementById('countdown');

        const timerInterval = setInterval(() => {
            timeLeft--;
            display.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                window.location.href = targetURL;
            }
        }, 1000);
    </script>
</body>
</html>
