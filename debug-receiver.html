 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Debugger</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; padding: 20px; font-size: 14px; }
        
        /* Video Area */
        .video-container { width: 100%; max-width: 640px; border: 2px solid #333; margin-bottom: 20px; position: relative; }
        video { width: 100%; height: auto; display: block; background: #111; }
        
        /* Status Bar */
        .status-bar { padding: 10px; background: #222; border-bottom: 1px solid #444; font-weight: bold; display: flex; justify-content: space-between; }
        .status-ok { color: #4ade80; }
        .status-err { color: #ef4444; }
        .status-wait { color: #facc15; }

        /* Button */
        button { background: #2563eb; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-bottom: 20px; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #555; cursor: not-allowed; opacity: 0.5; }

        /* Logs */
        #log { background: #111; border: 1px solid #333; padding: 10px; height: 300px; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h1>📡 WebRTC Connection Debugger</h1>
    
    <button id="btnStart" onclick="startReceiver()">1. CLICK TO START LISTENING</button>
    <button onclick="window.location.reload()" style="background:#444;">Refresh Page</button>

    <div class="video-container">
        <div class="status-bar">
            <span>Video Status:</span>
            <span id="vidState" class="status-wait">STOPPED</span>
        </div>
        <video id="remoteVideo" playsinline autoplay muted controls></video>
    </div>

    <h3>Connection Log:</h3>
    <div id="log">Logs will appear here...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // CONFIG
        const firebaseConfig = { 
            apiKey: "AIzaSyCWAxUm_Z_i-EP_xqayhQrwsL4Qkmh5fMA", 
            authDomain: "slidesync-37cd4.firebaseapp.com", 
            databaseURL: "https://slidesync-37cd4-default-rtdb.europe-west1.firebasedatabase.app", 
            projectId: "slidesync-37cd4", 
            storageBucket: "slidesync-37cd4.firebasestorage.app", 
            messagingSenderId: "996754972458", 
            appId: "1:996754972458:web:7f8be6880c3463ac6a4853" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // VARS
        let pc = null;
        let candidateQueue = [];
        const logBox = document.getElementById('log');
        const vidState = document.getElementById('vidState');

        function print(msg, type="info") {
            const time = new Date().toLocaleTimeString();
            const color = type === 'err' ? '#ef4444' : (type === 'ok' ? '#4ade80' : '#ccc');
            logBox.innerHTML = `<div style="color:${color}">[${time}] ${msg}</div>` + logBox.innerHTML;
        }

        // --- 1. START FUNCTION ---
        window.startReceiver = async () => {
            document.getElementById('btnStart').disabled = true;
            print("--- INITIALIZING ---");

            // Setup PeerConnection
            const config = { 
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ] 
            };
            
            try {
                pc = new RTCPeerConnection(config);
                print("✅ RTCPeerConnection Created", "ok");
            } catch(e) {
                print("❌ Failed to create PC: " + e.message, "err");
                return;
            }

            // EVENT: Track Received
            pc.ontrack = (event) => {
                print("🎥 STREAM TRACK RECEIVED!", "ok");
                const vid = document.getElementById('remoteVideo');
                vid.srcObject = event.streams[0];
                
                vid.onloadedmetadata = () => {
                    print(`✅ Video Metadata Loaded (${vid.videoWidth}x${vid.videoHeight})`, "ok");
                    vid.play().then(() => {
                        vidState.innerText = "PLAYING ✅";
                        vidState.className = "status-ok";
                    }).catch(e => {
                        print("⚠️ Autoplay blocked (Check browser settings): " + e.message, "err");
                    });
                };
            };

            // EVENT: Connection State Change
            pc.onconnectionstatechange = () => {
                const state = pc.connectionState;
                print(`🔄 Connection State: ${state.toUpperCase()}`, state === 'connected' ? 'ok' : 'info');
            };
            
            pc.oniceconnectionstatechange = () => {
                print(`❄️ ICE State: ${pc.iceConnectionState.toUpperCase()}`);
            };

            // EVENT: ICE Candidate (Send to Presenter)
            pc.onicecandidate = (event) => {
                if(event.candidate) {
                    push(ref(db, 'presentation/webrtc/audience_candidates'), event.candidate.toJSON());
                }
            };

            // START LISTENING
            listenForSignal();
        };

        // --- 2. SIGNALING ---
        function listenForSignal() {
            print("👂 Listening for Offer from Firebase...");
            
            // Listen for Offer
            onValue(ref(db, 'presentation/webrtc/offer'), async (snapshot) => {
                const offer = snapshot.val();
                
                if(!offer) {
                    print("... No offer found yet. (Did you refresh the Presenter?)");
                    return;
                }

                // Prevent reprocessing same offer
                if(pc.signalingState !== "stable") {
                    print("⚠️ Ignoring duplicate offer update.");
                    return;
                }

                print("📩 OFFER RECEIVED!", "ok");
                
                try {
                    await pc.setRemoteDescription(new RTCSessionDescription(offer));
                    print("✅ Remote Description Set", "ok");

                    // Process Queue
                    if(candidateQueue.length > 0) {
                        print(`Processing ${candidateQueue.length} queued candidates...`);
                        while(candidateQueue.length) {
                            await pc.addIceCandidate(candidateQueue.shift());
                        }
                    }

                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    print("✅ Local Answer Created", "ok");

                    await set(ref(db, 'presentation/webrtc/answer'), {
                        type: answer.type,
                        sdp: answer.sdp
                    });
                    print("📤 Answer Sent to Firebase", "ok");

                } catch(e) {
                    print("❌ Signaling Error: " + e.message, "err");
                }
            });

            // Listen for Candidates
            onValue(ref(db, 'presentation/webrtc/presenter_candidates'), (snapshot) => {
                snapshot.forEach(child => {
                    const candidate = new RTCIceCandidate(child.val());
                    if(pc.remoteDescription) {
                        pc.addIceCandidate(candidate).catch(e => print("Ice Error: " + e.message, "err"));
                    } else {
                        candidateQueue.push(candidate);
                    }
                });
            });
        }
    </script>
</body>
</html>
